name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xdotool
      - run: npm run compile
      - run: npm test
      - run: npm run build
      - run: npm run zip
      - run: npm run bundle:verify
      - run: npm run package:verify
      - run: npm run source:verify
      - run: npm run store:verify
      - run: npm run test:e2e:chromium
      - run: npm run test:visual
      - name: Test Firefox action and context menu
        run: npm run test:e2e:firefox:context
      - name: Test the native Firefox shortcut
        run: xvfb-run -a npm run test:e2e:firefox:native
